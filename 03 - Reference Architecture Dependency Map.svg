<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 2400 900" style="background-color: #fafafa;" role="graphics-document document" aria-label="Reference Architecture Dependency Map">
  <defs>
    <filter id="softShadow" x="-3%" y="-5%" width="106%" height="110%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>

    <marker id="dashArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .title-main { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 40px; font-weight: 800; fill: #0f172a; }
    .title-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 20px; fill: #64748b; }
    .section-label { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 22px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 1px; }
    .group-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2.5px; stroke-dasharray: 6 5; rx: 20px; ry: 20px; }

    .node-fnd { fill: #f0fdf4; stroke: #155724; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-fnd-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #14532d; }
    .node-fnd-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #166534; }

    .node-dec { fill: #eef2ff; stroke: #383d7a; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-dec-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #1e1b4b; }
    .node-dec-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #3730a3; }

    .node-wrk { fill: #ecfeff; stroke: #0c5460; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-wrk-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #083344; }
    .node-wrk-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #155e75; }

    .node-com { fill: #fff1f2; stroke: #721c24; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-com-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #4c0519; }
    .node-com-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #9f1239; }

    .node-vis { fill: #fffbeb; stroke: #856404; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-vis-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #451a03; }
    .node-vis-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #92400e; }

    .conn-solid { fill: none; stroke: #334155; stroke-width: 4px; stroke-linecap: round; }
    .conn-dash { fill: none; stroke: #64748b; stroke-width: 3px; stroke-dasharray: 10 7; stroke-linecap: round; }
    .lbl-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; }
    .lbl-text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
  </style>

  <!-- Title -->
  <text x="80" y="70" class="title-main">Reference Architecture Dependency Map</text>
  <text x="80" y="108" class="title-sub">Specification-First Architecture Capabilities, Dependencies &amp; Cross-Cutting Observability</text>

  <!-- === FOUNDATION GROUP === -->
  <g id="group-foundation">
    <rect x="80" y="180" width="560" height="260" class="group-bg"/>
    <text x="110" y="220" class="section-label">Configuration Foundation</text>

    <g id="node-001">
      <rect x="110" y="245" width="500" height="75" class="node-fnd"/>
      <text x="140" y="285" class="node-fnd-title">001 Business Configuration Framework</text>
      <text x="140" y="308" class="node-fnd-sub">Defines business intent, policies, and base schemas</text>
    </g>

    <g id="node-002">
      <rect x="110" y="340" width="500" height="75" class="node-fnd"/>
      <text x="140" y="380" class="node-fnd-title">002 Configuration Management Layer</text>
      <text x="140" y="403" class="node-fnd-sub">Validates and resolves runtime configuration context</text>
    </g>
  </g>

  <!-- === DECISION GROUP === -->
  <g id="group-decision">
    <rect x="720" y="180" width="360" height="260" class="group-bg"/>
    <text x="750" y="220" class="section-label">Decision Layer</text>

    <g id="node-003">
      <rect x="750" y="280" width="300" height="85" class="node-dec"/>
      <text x="780" y="320" class="node-dec-title">003 Business Decision</text>
      <text x="780" y="343" class="node-dec-title">Framework</text>
    </g>
  </g>

  <!-- === WORKFLOW GROUP === -->
  <g id="group-workflow">
    <rect x="1160" y="180" width="560" height="260" class="group-bg"/>
    <text x="1190" y="220" class="section-label">Workflow Layer</text>

    <g id="node-004">
      <rect x="1190" y="245" width="500" height="75" class="node-wrk"/>
      <text x="1220" y="285" class="node-wrk-title">004 Customer Intake Request Model</text>
      <text x="1220" y="308" class="node-wrk-sub">Models request state, transitions, and lifecycle</text>
    </g>

    <g id="node-005">
      <rect x="1190" y="340" width="500" height="75" class="node-wrk"/>
      <text x="1220" y="380" class="node-wrk-title">005 Emergency Client-Contact Workflow</text>
      <text x="1220" y="403" class="node-wrk-sub">Orchestrates sequencing, escalation, and execution</text>
    </g>
  </g>

  <!-- === COMMUNICATION GROUP === -->
  <g id="group-communication">
    <rect x="1800" y="180" width="520" height="260" class="group-bg"/>
    <text x="1830" y="220" class="section-label">Communication Layer</text>

    <g id="node-006">
      <rect x="1830" y="280" width="460" height="85" class="node-com"/>
      <text x="1860" y="320" class="node-com-title">006 Client Notification</text>
      <text x="1860" y="343" class="node-com-title">Framework</text>
    </g>
  </g>

  <!-- === OPERATIONAL VISIBILITY === -->
  <g id="node-007">
    <rect x="900" y="640" width="600" height="130" class="node-vis"/>
    <text x="930" y="690" class="node-vis-title">007 Operational Visibility Framework</text>
    <text x="930" y="725" class="node-vis-sub">Records events, traces, and audit evidence across all layers</text>
  </g>

  <!-- === SOLID DEPENDENCY CONNECTIONS === -->

  <!-- 002 uses 001 -->
  <path d="M 610,377 L 670,377 L 670,282 L 750,282" class="conn-solid" marker-end="url(#arrow)"/>
  <rect x="655" y="266" width="60" height="30" class="lbl-bg"/>
  <text x="685" y="287" text-anchor="middle" class="lbl-text">uses</text>

  <!-- 003 consumes 002 -->
  <path d="M 1050,322 L 1160,322" class="conn-solid" marker-end="url(#arrow)"/>
  <rect x="1085" y="306" width="100" height="30" class="lbl-bg"/>
  <text x="1135" y="327" text-anchor="middle" class="lbl-text">consumes</text>

  <!-- 004 uses 003 (upper path) -->
  <path d="M 1050,282 L 1130,282 L 1130,227 L 1190,227" class="conn-solid" marker-end="url(#arrow)"/>
  <rect x="1085" y="211" width="60" height="30" class="lbl-bg"/>
  <text x="1115" y="232" text-anchor="middle" class="lbl-text">uses</text>

  <!-- 005 builds upon 004 -->
  <path d="M 1690,285 L 1760,285 L 1760,377 L 1830,377" class="conn-solid" marker-end="url(#arrow)"/>
  <rect x="1725" y="269" width="130" height="30" class="lbl-bg"/>
  <text x="1790" y="290" text-anchor="middle" class="lbl-text">builds upon</text>

  <!-- 006 consumes 004 (upper path) -->
  <path d="M 1690,227 L 1770,227 L 1770,305 L 1830,305" class="conn-solid" marker-end="url(#arrow)"/>
  <rect x="1725" y="211" width="100" height="30" class="lbl-bg"/>
  <text x="1775" y="232" text-anchor="middle" class="lbl-text">consumes</text>

  <!-- 006 consumes 005 (lower path) -->
  <path d="M 1690,377 L 1770,377 L 1770,340 L 1830,340" class="conn-solid" marker-end="url(#arrow)"/>
  <rect x="1725" y="361" width="100" height="30" class="lbl-bg"/>
  <text x="1775" y="382" text-anchor="middle" class="lbl-text">consumes</text>

  <!-- === DASHED TELEMETRY LINES TO 007 === -->

  <!-- 001 to 007 -->
  <path d="M 360,320 C 360,500 500,640 900,705" class="conn-dash" marker-end="url(#dashArrow)"/>

  <!-- 002 to 007 -->
  <path d="M 610,377 C 610,520 700,640 900,705" class="conn-dash" marker-end="url(#dashArrow)"/>

  <!-- 003 to 007 -->
  <path d="M 900,365 L 900,540 C 900,620 900,640 900,705" class="conn-dash" marker-end="url(#dashArrow)"/>

  <!-- 004 to 007 -->
  <path d="M 1440,245 C 1440,440 1300,640 1200,705" class="conn-dash" marker-end="url(#dashArrow)"/>

  <!-- 005 to 007 -->
  <path d="M 1690,377 C 1690,500 1550,640 1500,705" class="conn-dash" marker-end="url(#dashArrow)"/>

  <!-- 006 to 007 -->
  <path d="M 2060,365 C 2060,520 1750,640 1500,705" class="conn-dash" marker-end="url(#dashArrow)"/>

  <!-- Telemetry label -->
  <rect x="1250" y="540" width="160" height="32" class="lbl-bg"/>
  <text x="1330" y="562" text-anchor="middle" class="lbl-text">emits events to</text>

</svg>
