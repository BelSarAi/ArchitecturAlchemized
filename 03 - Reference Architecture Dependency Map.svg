<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="background-color: #fafbfd;" viewBox="0 0 1100 1320" role="graphics-document document" aria-roledescription="flowchart-v2">
  <defs>
    <!-- Filter for modern soft drop shadow layout -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Marker definition for connecting workflow items -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <style>
    /* Typography & Titles */
    .title-main { font-family: "Lucida Console", Monaco, "trebuchet ms", verdana, sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; letter-spacing: -0.5px; }
    .subtitle-main { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #64748b; font-weight: 600; letter-spacing: 0.5px; }
    
    /* Layout Layer Groups */
    .group-border { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 2.5px; stroke-dasharray: 6 5; rx: 20px; ry: 20px; }
    .group-label { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 20px; font-weight: 800; fill: #334155; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Node Shapes and Core Aesthetics */
    /* Foundation Layer -> Theme Sage Green */
    .node-fnd { fill: #f0fdf4; stroke: #155724; stroke-width: 3px; rx: 14px; ry: 12px; filter: url(#shadow); }
    .node-fnd-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #14532d; }
    .node-fnd-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #166534; font-weight: 500; opacity: 0.9; }

    /* Decision Layer -> Theme Indigo */
    .node-dec { fill: #eef2ff; stroke: #383d7a; stroke-width: 3px; rx: 14px; ry: 12px; filter: url(#shadow); }
    .node-dec-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #1e1b4b; }
    .node-dec-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #312e81; font-weight: 500; opacity: 0.9; }

    /* Workflow Layer -> Theme Ocean Teal */
    .node-wrk { fill: #ecfeff; stroke: #0c5460; stroke-width: 3px; rx: 14px; ry: 12px; filter: url(#shadow); }
    .node-wrk-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #083344; }
    .node-wrk-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #155e75; font-weight: 500; opacity: 0.9; }

    /* Communication Layer -> Theme Soft Coral Rose */
    .node-com { fill: #fff1f2; stroke: #721c24; stroke-width: 3px; rx: 14px; ry: 12px; filter: url(#shadow); }
    .node-com-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #4c0519; }
    .node-com-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #9f1239; font-weight: 500; opacity: 0.9; }

    /* Telemetry Cross-cutting Layer -> Theme Soft Amber */
    .node-vis { fill: #fffbeb; stroke: #856404; stroke-width: 3px; rx: 14px; ry: 12px; filter: url(#shadow); }
    .node-vis-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #451a03; }
    .node-vis-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #92400e; font-weight: 500; opacity: 0.9; }

    /* Structural Connectors */
    .conn-solid { fill: none; stroke: #1e293b; stroke-width: 3.5px; stroke-linecap: round; }
    .conn-dash { fill: none; stroke: #64748b; stroke-width: 2.5px; stroke-dasharray: 8 6; stroke-linecap: round; }
    
    /* Connectors Label Styling */
    .lbl-bg { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5px; rx: 6px; ry: 6px; filter: drop-shadow(1px 2px 2px rgba(100, 116, 139, 0.15)); }
    .lbl-text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 15px; font-weight: 800; fill: #1e293b; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- ========================================================== -->
  <!-- CANVAS TITLE AND CAPTION DISPLAY                          -->
  <!-- ========================================================== -->
  <text x="60" y="65" class="title-main">REFERENCE ARCHITECTURE DEPENDENCY MAP</text>
  <text x="60" y="95" class="subtitle-main">PORTFOLIO DEMONSTRATION &amp; CAPABILITY BOUNDARIES (16:11 SCALED ASPECT RATIO)</text>

  <!-- ========================================================== -->
  <!-- LAYER 1: CONFIGURATION FOUNDATION                         -->
  <!-- ========================================================== -->
  <g id="layer-foundation">
    <rect x="50" y="140" width="1000" height="200" class="group-border" />
    <text x="80" y="178" class="group-label">01 — Configuration Foundation</text>

    <!-- 001 Business Configuration Framework -->
    <g id="node-001">
      <rect x="80" y="205" width="410" height="110" class="node-fnd" />
      <text x="110" y="253" class="node-fnd-title">001 Business Conf. Framework</text>
      <text x="110" y="283" class="node-fnd-sub">Defines static configurations and baseline schemas</text>
    </g>

    <!-- 002 Configuration Management Layer -->
    <g id="node-002">
      <rect x="610" y="205" width="410" height="110" class="node-fnd" />
      <text x="640" y="253" class="node-fnd-title">002 Conf. Management Layer</text>
      <text x="640" y="283" class="node-fnd-sub">Manages profile resolutions and overrides at runtime</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER 2: CHASSIS & DECISION ENGINE                        -->
  <!-- ========================================================== -->
  <g id="layer-decision">
    <rect x="50" y="380" width="1000" height="180" class="group-border" />
    <text x="80" y="418" class="group-label">02 — Decision Core</text>

    <!-- 003 Business Decision Framework -->
    <g id="node-003">
      <rect x="330" y="435" width="440" height="110" class="node-dec" />
      <text x="360" y="483" class="node-dec-title">003 Business Decision Framework</text>
      <text x="360" y="513" class="node-dec-sub">Evaluates business policies &amp; operational logic</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER 3: WORKFLOW LIFE-CYCLE AND PIPELINES                -->
  <!-- ========================================================== -->
  <g id="layer-workflow">
    <rect x="50" y="600" width="1000" height="300" class="group-border" />
    <text x="80" y="638" class="group-label">03 — State Engine &amp; Workflow Execution</text>

    <!-- 004 Customer Intake Request Model -->
    <g id="node-004">
      <rect x="80" y="665" width="410" height="110" class="node-wrk" />
      <text x="110" y="713" class="node-wrk-title">004 Customer Intake Model</text>
      <text x="110" y="743" class="node-wrk-sub">Ingests inbound actions and tracks process state</text>
    </g>

    <!-- 005 Emergency Client-Contact Workflow -->
    <g id="node-005">
      <rect x="610" y="665" width="410" height="110" class="node-wrk" />
      <text x="640" y="713" class="node-wrk-title">005 Emergency Contact Workflow</text>
      <text x="640" y="743" class="node-wrk-sub">Orchestrates automated routing &amp; escalation</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER 4: INTEGRATED CHANNELS AND SYSTEM OBSERVABILITY    -->
  <!-- ========================================================== -->
  <g id="layer-outbound">
    <rect x="50" y="940" width="1000" height="320" class="group-border" />
    <text x="80" y="978" class="group-label">04 — Outbound Layers &amp; Cross-Cutting Services</text>

    <!-- 006 Client Notification Framework -->
    <g id="node-006">
      <rect x="80" y="1005" width="410" height="110" class="node-com" />
      <text x="110" y="1053" class="node-com-title">006 Client Notification Framework</text>
      <text x="110" y="1083" class="node-com-sub">Constructs alerts and dispatches via SMS/Email</text>
    </g>

    <!-- 007 Operational Visibility Framework -->
    <g id="node-007">
      <rect x="610" y="1005" width="410" height="110" class="node-vis" />
      <text x="640" y="1053" class="node-vis-title">007 Operational Visibility Framework</text>
      <text x="640" y="1083" class="node-vis-sub">Systemic traces, event logs, and contract audits</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- OPTIMIZED CRITICAL ARROW ROUTINGS (DEPENDENCIES)         -->
  <!-- ========================================================== -->
  
  <!-- 002 uses 001 (Horizontal in Group) -->
  <path d="M 610,260 L 502,260" class="conn-solid" marker-end="url(#arrow)" />
  <rect x="532" y="247" width="50" height="26" class="lbl-bg" />
  <text x="557" y="265" text-anchor="middle" class="lbl-text">uses</text>

  <!-- 003 consumes 002 (Down-to-Up Diagonal Curve) -->
  <path d="M 815,318 C 815,360 630,360 580,423" class="conn-solid" marker-end="url(#arrow)" />
  <rect x="625" y="347" width="100" height="26" class="lbl-bg" />
  <text x="675" y="365" text-anchor="middle" class="lbl-text">consumes</text>

  <!-- 004 uses 003 (Upward Diagonal Curve connection) -->
  <path d="M 285,662 C 285,610 400,610 460,557" class="conn-solid" marker-end="url(#arrow)" />
  <rect x="330" y="583" width="60" height="26" class="lbl-bg" />
  <text x="360" y="601" text-anchor="middle" class="lbl-text">uses</text>

  <!-- 005 builds upon 004 (Horizontal in Group) -->
  <path d="M 610,720 L 502,720" class="conn-solid" marker-end="url(#arrow)" />
  <rect x="518" y="707" width="80" height="26" class="lbl-bg" />
  <text x="558" y="725" text-anchor="middle" class="lbl-text">builds up</text>

  <!-- 006 consumes 004 (Direct Vertical down line) -->
  <path d="M 285,780 L 285,993" class="conn-solid" marker-end="url(#arrow)" />
  <rect x="235" y="865" width="100" height="26" class="lbl-bg" />
  <text x="285" y="883" text-anchor="middle" class="lbl-text">consumes</text>

  <!-- 006 consumes 005 (Left Diagonal across workflow to client notification) -->
  <path d="M 815,780 C 815,860 380,860 315,1001" class="conn-solid" marker-end="url(#arrow)" />
  <text class="lbl-text" fill="#1e293b" x="510" y="855">consumes</text>

  <!-- ========================================================== -->
  <!-- SYSTEM TELETEMTRY & EVENT EMISSION PIPELINES (007 ADAPTER)-->
  <!-- ========================================================== -->
  
  <!-- Curved pipeline from Foundation down to 007 -->
  <path d="M 1023,260 C 1070,260 1070,890 850,1001" class="conn-dash" marker-end="url(#dash-arrow)" />
  
  <!-- Curved pipeline from decision 003 down to 007 -->
  <path d="M 773,490 C 880,490 880,890 825,993" class="conn-dash" marker-end="url(#dash-arrow)" />

  <!-- Direct pipeline from Workflow metrics to 007 adapter -->
  <path d="M 815,780 L 815,993" class="conn-dash" marker-end="url(#dash-arrow)" />
  <rect x="765" y="865" width="100" height="26" class="lbl-bg" />
  <text x="815" y="883" text-anchor="middle" class="lbl-text" fill="#64748b" style="font-size: 13px;">emits events</text>

</svg>
