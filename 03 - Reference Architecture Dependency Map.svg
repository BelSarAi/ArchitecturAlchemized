<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1700" style="background-color: #fafafa;" role="graphics-document document" aria-label="Reference Architecture Dependency Map">
  <defs>
    <filter id="softShadow" x="-5%" y="-3%" width="110%" height="106%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .title-main { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 38px; font-weight: 800; fill: #0f172a; }
    .title-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #64748b; }
    .section-label { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 20px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 1px; }
    .group-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2.5px; stroke-dasharray: 6 5; rx: 20px; ry: 20px; }

    .node-fnd { fill: #f0fdf4; stroke: #155724; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-fnd-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #14532d; }
    .node-fnd-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #166534; }

    .node-dec { fill: #eef2ff; stroke: #383d7a; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-dec-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #1e1b4b; }

    .node-wrk { fill: #ecfeff; stroke: #0c5460; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-wrk-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #083344; }

    .node-com { fill: #fff1f2; stroke: #721c24; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-com-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #4c0519; }
    .node-com-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #9f1239; }

    .node-vis { fill: #fffbeb; stroke: #856404; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-vis-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #451a03; }
    .node-vis-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #92400e; }

    .conn-uses { fill: none; stroke: #dc2626; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
    .conn-consumes { fill: none; stroke: #2563eb; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
    .conn-builds { fill: none; stroke: #16a34a; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
    .conn-emits { fill: none; stroke: #d97706; stroke-width: 3px; stroke-dasharray: 10 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }

    .halo { fill: none; stroke: #ffffff; stroke-width: 8px; stroke-linecap: round; stroke-linejoin: round; }

    .legend-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2px; rx: 14px; filter: url(#softShadow); }
    .legend-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
    .legend-text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #334155; }
  </style>

  <!-- Title -->
  <text x="100" y="55" class="title-main">Reference Architecture Dependency Map</text>
  <text x="100" y="85" class="title-sub">Vertical capability stack with dependency semantics and cross-cutting observability</text>

  <!-- ================= NODES LAYER (drawn first, connectors will overlay) ================= -->

  <!-- Foundation Group -->
  <rect x="100" y="110" width="1000" height="300" class="group-bg"/>
  <text x="130" y="145" class="section-label">01 — Configuration Foundation</text>

  <g id="node-001">
    <rect x="150" y="165" width="900" height="110" class="node-fnd"/>
    <text x="185" y="215" class="node-fnd-title">001 Business Configuration Framework</text>
    <text x="185" y="250" class="node-fnd-sub">Defines business intent, policies, and base schemas</text>
  </g>

  <g id="node-002">
    <rect x="150" y="305" width="900" height="90" class="node-fnd"/>
    <text x="185" y="355" class="node-fnd-title">002 Configuration Management Layer</text>
  </g>

  <!-- Decision Group -->
  <rect x="100" y="450" width="1000" height="155" class="group-bg"/>
  <text x="130" y="485" class="section-label">02 — Decision Layer</text>

  <g id="node-003">
    <rect x="150" y="515" width="900" height="90" class="node-dec"/>
    <text x="185" y="565" class="node-dec-title">003 Business Decision Framework</text>
  </g>

  <!-- Workflow Group -->
  <rect x="100" y="635" width="760" height="320" class="group-bg"/>
  <text x="130" y="670" class="section-label">03 — Workflow Layer</text>

  <g id="node-004">
    <rect x="150" y="705" width="660" height="90" class="node-wrk"/>
    <text x="185" y="755" class="node-wrk-title">004 Customer Intake Request Model</text>
  </g>

  <g id="node-005">
    <rect x="150" y="840" width="660" height="90" class="node-wrk"/>
    <text x="185" y="890" class="node-wrk-title">005 Emergency Client-Contact Workflow</text>
  </g>

  <!-- Communication Node (sidecar, aligned with 005) -->
  <g id="node-006">
    <rect x="930" y="820" width="240" height="130" class="node-com"/>
    <text x="1050" y="855" class="node-com-title" text-anchor="middle">006 Client</text>
    <text x="1050" y="885" class="node-com-title" text-anchor="middle">Notification</text>
    <text x="1050" y="915" class="node-com-title" text-anchor="middle">Framework</text>
  </g>

  <!-- Cross-Cutting Visibility -->
  <rect x="80" y="1005" width="1040" height="155" class="group-bg"/>
  <text x="110" y="1040" class="section-label">04 — Cross-Cutting Operational Visibility</text>

  <g id="node-007">
    <rect x="100" y="1055" width="1000" height="90" class="node-vis"/>
    <text x="600" y="1100" class="node-vis-title" text-anchor="middle">007 Operational Visibility Framework</text>
    <text x="600" y="1135" class="node-vis-sub" text-anchor="middle">Records events, traces, and audit evidence from every capability</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="100" y="1200" width="1000" height="220" class="legend-box"/>
    <text x="130" y="1245" class="legend-title">Dependency Legend</text>

    <line x1="130" y1="1290" x2="230" y2="1290" class="halo"/>
    <line x1="130" y1="1290" x2="230" y2="1290" class="conn-uses" marker-end="url(#arrowRed)"/>
    <text x="260" y="1298" class="legend-text"><tspan font-weight="700" fill="#dc2626">Uses</tspan> — Relies on another capability</text>

    <line x1="130" y1="1340" x2="230" y2="1340" class="halo"/>
    <line x1="130" y1="1340" x2="230" y2="1340" class="conn-consumes" marker-end="url(#arrowBlue)"/>
    <text x="260" y="1348" class="legend-text"><tspan font-weight="700" fill="#2563eb">Consumes</tspan> — Reads another capability's output</text>

    <line x1="130" y1="1390" x2="230" y2="1390" class="halo"/>
    <line x1="130" y1="1390" x2="230" y2="1390" class="conn-builds" marker-end="url(#arrowGreen)"/>
    <text x="260" y="1398" class="legend-text"><tspan font-weight="700" fill="#16a34a">Builds Upon</tspan> — Extends a prior capability</text>

    <line x1="130" y1="1440" x2="230" y2="1440" class="halo"/>
    <line x1="130" y1="1440" x2="230" y2="1440" class="conn-emits" marker-end="url(#arrowAmber)"/>
    <text x="260" y="1448" class="legend-text"><tspan font-weight="700" fill="#d97706">Emits Events</tspan> — Operational telemetry</text>
  </g>

  <!-- ================= CONNECTORS LAYER (drawn last, overlaying nodes) ================= -->

  <!-- 001 -> 002 (uses, red) -->
  <path d="M 600,275 C 600,288 600,292 600,305" class="halo"/>
  <path d="M 600,275 C 600,288 600,292 600,305" class="conn-uses" marker-end="url(#arrowRed)"/>

  <!-- 002 -> 003 (consumes, blue) -->
  <path d="M 600,395 C 600,430 600,460 600,510" class="halo"/>
  <path d="M 600,395 C 600,430 600,460 600,510" class="conn-consumes" marker-end="url(#arrowBlue)"/>

  <!-- 003 -> 004 (uses, red) -->
  <path d="M 600,605 C 600,630 600,650 600,700" class="halo"/>
  <path d="M 600,605 C 600,630 600,650 600,700" class="conn-uses" marker-end="url(#arrowRed)"/>

  <!-- 004 -> 005 (builds upon, green) -->
  <path d="M 600,795 C 600,805 600,815 600,840" class="halo"/>
  <path d="M 600,795 C 600,805 600,815 600,840" class="conn-builds" marker-end="url(#arrowGreen)"/>

  <!-- 004 -> 006 (consumes, blue) routed far right -->
  <path d="M 810,750 C 870,750 900,800 930,820" class="halo"/>
  <path d="M 810,750 C 870,750 900,800 930,820" class="conn-consumes" marker-end="url(#arrowBlue)"/>

  <!-- 005 -> 006 (consumes, blue) routed far right -->
  <path d="M 810,885 C 870,885 900,885 930,885" class="halo"/>
  <path d="M 810,885 C 870,885 900,885 930,885" class="conn-consumes" marker-end="url(#arrowBlue)"/>

  <!-- Telemetry fan to 007 -->
  <path d="M 320,275 C 320,500 320,700 320,1055" class="halo"/>
  <path d="M 320,275 C 320,500 320,700 320,1055" class="conn-emits" marker-end="url(#arrowAmber)"/>

  <path d="M 600,395 C 580,500 580,700 580,1055" class="halo"/>
  <path d="M 600,395 C 580,500 580,700 580,1055" class="conn-emits" marker-end="url(#arrowAmber)"/>

  <path d="M 880,515 C 840,650 840,800 820,1055" class="halo"/>
  <path d="M 880,515 C 840,650 840,800 820,1055" class="conn-emits" marker-end="url(#arrowAmber)"/>

  <path d="M 810,750 C 820,800 820,900 860,1055" class="halo"/>
  <path d="M 810,750 C 820,800 820,900 860,1055" class="conn-emits" marker-end="url(#arrowAmber)"/>

  <path d="M 810,885 C 860,900 860,950 900,1055" class="halo"/>
  <path d="M 810,885 C 860,900 860,950 900,1055" class="conn-emits" marker-end="url(#arrowAmber)"/>

  <path d="M 1050,855 C 1050,950 1050,1000 1020,1055" class="halo"/>
  <path d="M 1050,855 C 1050,950 1050,1000 1020,1055" class="conn-emits" marker-end="url(#arrowAmber)"/>

</svg>
