<svg id="my-svg" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1400 1700" style="background-color: #fafafa;" role="graphics-document document" aria-label="Reference Architecture Dependency Map">
  <defs>
    <filter id="softShadow" x="-5%" y="-3%" width="110%" height="106%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6b7280"/>
    </marker>
  </defs>

  <style>
    .title-main { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 38px; font-weight: 800; fill: #0f172a; }
    .title-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #64748b; }
    .section-label { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 20px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 1px; }
    .group-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2.5px; stroke-dasharray: 6 5; rx: 20px; ry: 20px; }

    .node-fnd { fill: #f0fdf4; stroke: #155724; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-fnd-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 26px; font-weight: 800; fill: #14532d; }
    .node-fnd-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 17px; fill: #166534; }

    .node-dec { fill: #eef2ff; stroke: #383d7a; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-dec-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 26px; font-weight: 800; fill: #1e1b4b; }

    .node-wrk { fill: #ecfeff; stroke: #0c5460; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-wrk-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 26px; font-weight: 800; fill: #083344; }

    .node-com { fill: #fff1f2; stroke: #721c24; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-com-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 26px; font-weight: 800; fill: #4c0519; }

    .node-vis { fill: #fffbeb; stroke: #856404; stroke-width: 3.5px; rx: 16px; filter: url(#softShadow); }
    .node-vis-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 28px; font-weight: 800; fill: #451a03; }
    .node-vis-sub { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #92400e; }

    .conn-uses { fill: none; stroke: #dc2626; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
    .conn-consumes { fill: none; stroke: #2563eb; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
    .conn-builds { fill: none; stroke: #16a34a; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
    .conn-emits { fill: none; stroke: #6b7280; stroke-width: 3px; stroke-dasharray: 10 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }

    .halo { fill: none; stroke: #ffffff; stroke-width: 8px; stroke-linecap: round; stroke-linejoin: round; }

    .legend-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2px; rx: 14px; filter: url(#softShadow); }
    .legend-title { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
    .legend-text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 18px; fill: #334155; }
  </style>

  <!-- Title -->
  <text x="140" y="55" class="title-main">Reference Architecture Dependency Map</text>
  <text x="140" y="85" class="title-sub">Vertical capability stack with dependency semantics and cross-cutting observability</text>

  <!-- ================= NODES LAYER ================= -->

  <!-- Foundation Group -->
  <rect x="140" y="110" width="1120" height="300" class="group-bg"/>
  <text x="170" y="145" class="section-label">01 — Configuration Foundation</text>

  <g id="node-001">
    <rect x="190" y="160" width="1020" height="110" class="node-fnd"/>
    <text x="225" y="210" class="node-fnd-title">001 Business Configuration Framework</text>
    <text x="225" y="245" class="node-fnd-sub">Defines business intent, policies, and base schemas</text>
  </g>

  <g id="node-002">
    <rect x="190" y="300" width="1020" height="90" class="node-fnd"/>
    <text x="225" y="350" class="node-fnd-title">002 Configuration Management Layer</text>
  </g>

  <!-- Decision Group -->
  <rect x="140" y="450" width="1120" height="155" class="group-bg"/>
  <text x="170" y="485" class="section-label">02 — Decision Layer</text>

  <g id="node-003">
    <rect x="190" y="515" width="1020" height="90" class="node-dec"/>
    <text x="225" y="565" class="node-dec-title">003 Business Decision Framework</text>
  </g>

  <!-- Workflow Group (55%) -->
  <rect x="120" y="635" width="640" height="320" class="group-bg"/>
  <text x="150" y="670" class="section-label">03 — Workflow Layer</text>

  <g id="node-004">
    <rect x="160" y="705" width="560" height="90" class="node-wrk"/>
    <text x="195" y="755" class="node-wrk-title">004 Customer Intake Request Model</text>
  </g>

  <g id="node-005">
    <rect x="160" y="840" width="560" height="90" class="node-wrk"/>
    <text x="195" y="890" class="node-wrk-title">005 Emergency Client-Contact Workflow</text>
  </g>

  <!-- Communication Group (45%) -->
  <rect x="760" y="635" width="520" height="320" class="group-bg"/>
  <text x="790" y="670" class="section-label">04 — Communication Layer</text>

  <g id="node-006">
    <rect x="790" y="735" width="460" height="130" class="node-com"/>
    <text x="1020" y="775" class="node-com-title" text-anchor="middle">006 Client Notification</text>
    <text x="1020" y="810" class="node-com-title" text-anchor="middle">Framework</text>
  </g>

  <!-- Cross-Cutting Visibility -->
  <rect x="80" y="1005" width="1240" height="155" class="group-bg"/>
  <text x="110" y="1040" class="section-label">05 — Cross-Cutting Operational Visibility</text>

  <g id="node-007">
    <rect x="100" y="1055" width="1200" height="90" class="node-vis"/>
    <text x="700" y="1100" class="node-vis-title" text-anchor="middle">007 Operational Visibility Framework</text>
    <text x="700" y="1135" class="node-vis-sub" text-anchor="middle">Records events, traces, and audit evidence from every capability</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="140" y="1200" width="1120" height="280" class="legend-box"/>
    <text x="170" y="1245" class="legend-title">Dependency Legend</text>

    <line x1="170" y1="1290" x2="270" y2="1290" class="halo"/>
    <line x1="170" y1="1290" x2="270" y2="1290" class="conn-uses" marker-end="url(#arrowRed)"/>
    <text x="300" y="1298" class="legend-text"><tspan font-weight="700" fill="#dc2626">Uses</tspan> — Relies on another capability</text>

    <line x1="170" y1="1350" x2="270" y2="1350" class="halo"/>
    <line x1="170" y1="1350" x2="270" y2="1350" class="conn-consumes" marker-end="url(#arrowBlue)"/>
    <text x="300" y="1358" class="legend-text"><tspan font-weight="700" fill="#2563eb">Consumes</tspan> — Reads another capability's output</text>

    <line x1="170" y1="1410" x2="270" y2="1410" class="halo"/>
    <line x1="170" y1="1410" x2="270" y2="1410" class="conn-builds" marker-end="url(#arrowGreen)"/>
    <text x="300" y="1418" class="legend-text"><tspan font-weight="700" fill="#16a34a">Builds Upon</tspan> — Extends a prior capability</text>

    <line x1="170" y1="1470" x2="270" y2="1470" class="halo"/>
    <line x1="170" y1="1470" x2="270" y2="1470" class="conn-emits" marker-end="url(#arrowGray)"/>
    <text x="300" y="1478" class="legend-text"><tspan font-weight="700" fill="#6b7280">Emits Events</tspan> — Operational telemetry</text>
  </g>

  <!-- ================= CONNECTORS LAYER (above nodes) ================= -->

  <!-- 001 -> 002 (uses, red) -->
  <path d="M 700,270 C 700,280 700,290 700,300" class="halo"/>
  <path d="M 700,270 C 700,280 700,290 700,300" class="conn-uses" marker-end="url(#arrowRed)"/>

  <!-- 002 -> 003 (consumes, blue) -->
  <path d="M 700,390 C 700,430 700,460 700,510" class="halo"/>
  <path d="M 700,390 C 700,430 700,460 700,510" class="conn-consumes" marker-end="url(#arrowBlue)"/>

  <!-- 003 -> 004 (uses, red) -->
  <path d="M 700,605 C 700,630 700,650 700,700" class="halo"/>
  <path d="M 700,605 C 700,630 700,650 700,700" class="conn-uses" marker-end="url(#arrowRed)"/>

  <!-- 004 -> 005 (builds upon, green) -->
  <path d="M 440,795 C 440,805 440,815 440,840" class="halo"/>
  <path d="M 440,795 C 440,805 440,815 440,840" class="conn-builds" marker-end="url(#arrowGreen)"/>

  <!-- 004 -> 006 (consumes, blue) -->
  <path d="M 720,750 C 760,750 780,800 790,800" class="halo"/>
  <path d="M 720,750 C 760,750 780,800 790,800" class="conn-consumes" marker-end="url(#arrowBlue)"/>

  <!-- 005 -> 006 (consumes, blue) -->
  <path d="M 720,885 C 760,885 780,850 790,850" class="halo"/>
  <path d="M 720,885 C 760,885 780,850 790,850" class="conn-consumes" marker-end="url(#arrowBlue)"/>

  <!-- Telemetry: 001 far left, curves around -->
  <path d="M 190,215 C 40,300 40,700 100,1055" class="halo"/>
  <path d="M 190,215 C 40,300 40,700 100,1055" class="conn-emits" marker-end="url(#arrowGray)"/>

  <!-- Telemetry: 002 far left -->
  <path d="M 190,345 C 60,450 60,750 150,1055" class="halo"/>
  <path d="M 190,345 C 60,450 60,750 150,1055" class="conn-emits" marker-end="url(#arrowGray)"/>

  <!-- Telemetry: 003 left side -->
  <path d="M 190,560 C 100,600 100,800 200,1055" class="halo"/>
  <path d="M 190,560 C 100,600 100,800 200,1055" class="conn-emits" marker-end="url(#arrowGray)"/>

  <!-- Telemetry: 004 left side -->
  <path d="M 160,750 C 90,800 90,900 300,1055" class="halo"/>
  <path d="M 160,750 C 90,800 90,900 300,1055" class="conn-emits" marker-end="url(#arrowGray)"/>

  <!-- Telemetry: 005 left side -->
  <path d="M 160,885 C 100,920 100,1000 400,1055" class="halo"/>
  <path d="M 160,885 C 100,920 100,1000 400,1055" class="conn-emits" marker-end="url(#arrowGray)"/>

  <!-- Telemetry: 006 bottom -->
  <path d="M 1020,865 C 1020,950 1020,1000 980,1055" class="halo"/>
  <path d="M 1020,865 C 1020,950 1020,1000 980,1055" class="conn-emits" marker-end="url(#arrowGray)"/>

</svg>
